name: CI

on:
    push:
        branches: [main]
    pull_request:

# A superseded run tells you nothing; cancel it and free the runner.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    PHP_VERSION: '8.3'
    NODE_VERSION: '22'

# Every job invokes `make` targets rather than repeating the commands here.
# The Makefile is the single definition of what "checked" means, so what runs
# in CI and what a developer runs locally cannot drift apart.

jobs:
    api:
        name: API
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  # No coverage driver: nothing measures coverage yet, and Xdebug
                  # makes the suite several times slower.
                  coverage: none
                  tools: composer:v2

            - name: Validate composer.json against its lock file
              run: make validate-api

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                  path: api/vendor
                  key: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-${{ hashFiles('api/composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-${{ env.PHP_VERSION }}-

            - name: Install dependencies
              run: make install-api

            # Formatting, PHPStan at level max, and the service-container lint —
            # the last of which is compile-time verification no test provides.
            - name: Lint
              run: make lint-api

            - name: Tests
              run: make test-api

            - name: Audit dependencies for known advisories
              run: make audit-api

    web:
        name: Web
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: web/package-lock.json

            # npm ci, not install: fails on lock drift instead of quietly
            # resolving something else.
            - name: Install dependencies
              run: make install-web

            - name: Lint and type check
              run: make lint-web

            - name: Tests
              run: make test-web

    docker:
        name: Docker
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Build images
              run: make build

            # The only job that verifies what a reader will actually do.
            # Unit tests passing while the image fails to build is a real
            # failure mode, and an embarrassing one to discover by hand.
            - name: Start the stack
              run: make up

            - name: Smoke test
              run: make smoke

            - name: Container logs
              if: failure()
              run: make logs-dump

            - name: Stop the stack
              if: always()
              run: make down

    # Single required check for branch protection: adding a job above does not
    # mean reconfiguring the repository settings.
    ci:
        name: CI
        runs-on: ubuntu-latest
        needs: [api, web, docker]
        if: always()
        steps:
            - name: Fail if any job did not succeed
              run: |
                  set -euo pipefail
                  results="${{ needs.api.result }} ${{ needs.web.result }} ${{ needs.docker.result }}"
                  echo "Results: $results"
                  for result in $results; do
                      test "$result" = success
                  done
