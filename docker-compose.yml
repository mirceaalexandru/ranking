services:
    api:
        build: ./api
        environment:
            # Bind plain HTTP; the default would try to obtain a TLS certificate.
            SERVER_NAME: ':80'
            APP_ENV: dev
            APP_DEBUG: '1'
            APP_SECRET: not-a-secret-this-app-has-no-sessions
        ports:
            # Overridable: other projects on this machine may already hold these.
            - '${API_PORT:-8081}:80'
        volumes:
            - ./api:/app
            # Keep the image's vendor/ rather than letting the bind mount hide it,
            # so a fresh clone works without installing anything locally.
            - /app/vendor
        healthcheck:
            test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1/api/health || exit 1']
            interval: 10s
            timeout: 3s
            retries: 5

    web:
        build: ./web
        ports:
            - '${WEB_PORT:-5174}:5173'
        environment:
            VITE_API_TARGET: http://api:80
        volumes:
            - ./web:/app
            - /app/node_modules
        depends_on:
            api:
                condition: service_healthy
        healthcheck:
            test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:5173/ >/dev/null || exit 1']
            interval: 10s
            timeout: 3s
            retries: 5
